name: Import complete uploaded archive

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: complete-archive-import
  cancel-in-progress: false

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check out transfer data
        uses: actions/checkout@v4
        with:
          ref: archive-transfer-20261101
          path: .archive-transfer
          fetch-depth: 1
          persist-credentials: false

      - name: Extract every original file and commit
        id: import
        env:
          EXPECTED_SHA256: 8df668d3f28a54a55fd074efd60a736b7758b99e1140514e21611f8589bb31a9
          EXPECTED_FILES: "33086"
        shell: python
        run: |
          import hashlib, os, shutil, subprocess
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          root = Path.cwd()
          temporary = Path(os.environ["RUNNER_TEMP"])
          archive = temporary / "original-upload.zip"
          parts = sorted((root / ".archive-transfer" / "parts").glob("part-*"))
          assert parts, "No archive parts"
          with archive.open("wb") as output:
              for part in parts:
                  with part.open("rb") as source:
                      shutil.copyfileobj(source, output)
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert checksum == os.environ["EXPECTED_SHA256"], "Archive checksum mismatch"
          site = temporary / "complete-extracted-site"
          site.mkdir(exist_ok=True)
          with ZipFile(archive) as source:
              entries = source.infolist()
              names = [entry.filename for entry in entries if not entry.is_dir()]
              assert len(names) == int(os.environ["EXPECTED_FILES"])
              assert len(names) == len(set(names)), "Duplicate archive paths"
              for entry in entries:
                  path = PurePosixPath(entry.filename)
                  assert not path.is_absolute() and ".." not in path.parts and ".git" not in path.parts
              source.extractall(site)
              for name in names:
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(site / name, target)
                  assert hashlib.sha256(target.read_bytes()).digest() == hashlib.sha256(source.read(name)).digest()
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          for offset in range(0, len(names), 200):
              subprocess.run(["git", "add", "-f", "--", *names[offset:offset + 200]], check=True)
          subprocess.run(["git", "rm", "--", ".github/workflows/import-complete-archive.yml"], check=True)
          tracked = set(subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")) - {""}
          assert tracked == set(names), f"Tracked files differ: {len(tracked)} vs {len(names)}"
          subprocess.run(["git", "commit", "-m", "Upload all 33,086 original extracted files with complete folders"], check=True, stdout=subprocess.DEVNULL)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          print(f"Verified and uploaded {len(names)} original files, all bytes unchanged.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Uploaded all **{len(names):,}** original files with matching SHA-256 hashes and original folder paths.\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("uploaded=true\n")

      - name: Remove temporary transfer branch
        if: steps.import.outputs.uploaded == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/archive-transfer-20261101"
            });

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload extracted site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/complete-extracted-site

      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
