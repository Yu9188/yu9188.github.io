name: Import complete uploaded archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/import-complete-archive.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: complete-archive-import
  cancel-in-progress: false

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out verified transfer data
        uses: actions/checkout@v4
        with:
          ref: complete-site-transfer-20261101
          path: .archive-transfer
          fetch-depth: 1
          persist-credentials: false

      - name: Restore every original path and verify its Git object
        id: import
        env:
          EXPECTED_SHA256: 24b6ccb6902ff88d4aee9eea69b660d477719deb95a57a72d67b6dfb2735564b
          SOURCE_COMMIT: 350ade71518c673565dd90cfa45509c91097ee0a
          EXPECTED_ORIGINAL_FILES: "33086"
        shell: python
        run: |
          import hashlib, os, shutil, subprocess
          from pathlib import Path

          root = Path.cwd()
          temporary = Path(os.environ["RUNNER_TEMP"])
          bundle = temporary / "complete-site.bundle"
          parts = sorted((root / ".archive-transfer" / "parts").glob("part-*"))
          assert parts, "Missing transfer parts"
          digest = hashlib.sha256()
          with bundle.open("wb") as output:
              for part in parts:
                  with part.open("rb") as source:
                      while data := source.read(1024 * 1024):
                          digest.update(data)
                          output.write(data)
          assert digest.hexdigest() == os.environ["EXPECTED_SHA256"], "Transfer checksum mismatch"
          source_commit = os.environ["SOURCE_COMMIT"]
          subprocess.run(["git", "bundle", "verify", str(bundle)], check=True)
          subprocess.run(["git", "fetch", str(bundle), "HEAD:refs/remotes/upload/source"], check=True)
          received = subprocess.check_output(["git", "rev-parse", "refs/remotes/upload/source"]).decode().strip()
          assert received == source_commit, "Unexpected source commit"
          shutil.rmtree(root / ".archive-transfer")
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "merge", "--no-ff", "-m", "Publish complete game with all 33086 original files and folders", source_commit], check=True, stdout=subprocess.DEVNULL)
          changes = subprocess.check_output(["git", "diff", "--name-only", source_commit, "HEAD"]).decode().splitlines()
          assert changes == [".github/workflows/import-complete-archive.yml"], f"Unexpected source differences: {changes}"
          files = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "-z", "HEAD"]).decode().split("\0")
          files = [name for name in files if name and not name.startswith(".github/")]
          objects = subprocess.check_output(["git", "ls-tree", "-r", "-z", source_commit]).split(b"\0")
          expected_hashes = {}
          for item in objects:
              if item:
                  metadata, name = item.split(b"\t", 1)
                  expected_hashes[name.decode()] = metadata.split()[2].decode()
          assert len(files) == int(os.environ["EXPECTED_ORIGINAL_FILES"]) + 2
          assert "Degrees of Lewdity.html" in files and "index.html" in files and ".nojekyll" in files
          assert "img/clothes/neck/collarfamiliar/acc.png" in files
          assert "img/clothes/neck/collarfamiliar/Acc.png" in files
          site = temporary / "complete-extracted-site"
          site.mkdir(exist_ok=True)
          for name in files:
              target = site / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(root / name, target)
              content = target.read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest()
              expected = expected_hashes[name]
              assert actual == expected, f"File content mismatch: {name}"
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Verified all **33,086 original files** with original case-sensitive paths and unchanged contents. Added only index.html and .nojekyll for Pages.\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("uploaded=true\n")

      - name: Remove temporary transfer branch
        if: steps.import.outputs.uploaded == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/complete-site-transfer-20261101"
            });

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload complete site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/complete-extracted-site

      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
